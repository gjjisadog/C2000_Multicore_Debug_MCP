interface:
  display_name: "C2000 Multicore Debug"
  short_description: "Guide F28P65x dual-core debugging."
  default_prompt: "Use $c2000-multicore-debug to run F28P65x CPU1/CPU2 work in one isolated temporary CCS workspace and one server-internal workflow, then close the DebugSession and workflow workspace together in one final cleanup."

dependencies:
  tools:
    - type: "mcp"
      value: "c2000_multicore"
      description: "c2000-multicore-mcp server exposing explicit sessionId/coreId and workflow debug tools."

policy:
  allow_implicit_invocation: true
