name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-ci:
    name: Fast CI (${{ matrix.os }}, Node ${{ matrix.node }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --reporter=default
      - run: npm run build
      - run: npm run doctor

  deep-ci:
    name: Deep CI
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run doctor:isolated
      - run: npm run verify:runtime-cwd
      - run: npm run verify:daemon-proxy
      - run: npm run verify:daemon-restart
      - run: npm run verify:can:mock
      - run: npx vitest run tests/leaseFencing.test.ts tests/boardLeaseGroup.test.ts tests/boardExecutionSemaphore.test.ts tests/canChannelLease.test.ts tests/pcanBasicAdapter.test.ts tests/canWorkerBoundary.test.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-ci-diagnostics
          if-no-files-found: ignore
          path: |
            runtime/**
            dist/src/runtime-manifest.json

  packaging-ci:
    name: Packaging CI
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - run: node scripts/verify-package-install.mjs
      - run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: package-linux-x64
          path: |
            c2000-multicore-mcp-*.tgz
            dist/src/runtime-manifest.json
            sbom.cdx.json
